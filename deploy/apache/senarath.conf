# ============================================================================
# Senarath Bank - native Apache virtual hosts (WEB01, no Docker)
# LAB ENVIRONMENT - fictional institution, intentional weaknesses V1-V6
# ----------------------------------------------------------------------------
# Name-based virtual hosting on one Apache instance:
#   senarathbank.com / www.senarathbank.com            -> corporate site
#   ebanking.senarathbank.com / www.ebanking...        -> online banking app
#
# Copy to /etc/apache2/sites-available/senarath.conf, then:
#   a2dissite 000-default
#   a2ensite senarath
#   systemctl reload apache2
#
# TLS is added automatically by `certbot --apache` (it writes the :443 vhosts
# and the HTTP->HTTPS redirect). See DEPLOY.md section 7.
# ============================================================================

# ---- Corporate marketing site (default vhost: catches bare IP / unknown Host)
<VirtualHost *:80>
    ServerName senarathbank.com
    ServerAlias www.senarathbank.com
    DocumentRoot /var/www/senarath-corporate/src

    <Directory /var/www/senarath-corporate/src>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/corporate_error.log
    CustomLog ${APACHE_LOG_DIR}/corporate_access.log combined
</VirtualHost>

# ---- Online banking origin application
<VirtualHost *:80>
    ServerName ebanking.senarathbank.com
    ServerAlias www.ebanking.senarathbank.com
    DocumentRoot /var/www/senarath-ebanking/src

    <Directory /var/www/senarath-ebanking/src>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # V5: uploads/ lives inside the webroot and MUST stay PHP-executable.
    # Do NOT add "php_admin_flag engine Off" or a .htaccess disabling PHP here -
    # an uploaded .php is meant to run. (No special block needed; mod_php runs
    # .php everywhere under the docroot by default.)

    ErrorLog  ${APACHE_LOG_DIR}/ebanking_error.log
    CustomLog ${APACHE_LOG_DIR}/ebanking_access.log combined
</VirtualHost>
