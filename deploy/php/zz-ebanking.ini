; ============================================================================
; Senarath Bank - native PHP settings (WEB01, no Docker)   LAB ENVIRONMENT
; Mirrors the Docker image's zz-ebanking.ini so native behaviour matches.
; Copy to /etc/php/8.2/apache2/conf.d/zz-ebanking.ini then reload Apache.
; display_errors ON so the environment is easy to walk during the demo.
; Upload limits sized for KYC documents. NOTE: no upload hardening (V5).
; ============================================================================
display_errors = On
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
expose_php = On
