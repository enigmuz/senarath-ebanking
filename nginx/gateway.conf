# ============================================================================
# Senarath Bank — nginx application gateway (WEB01 origin)
# LAB ENVIRONMENT
# ----------------------------------------------------------------------------
# Routes by hostname to the two app containers on the shared docker network:
#   www.senarathbank.com  / senarathbank.com -> corporate container
#   online.senarathbank.com                  -> ebanking container
#
# This is the ORIGIN. In the full lab a separate WAF/CDN (WAF01) sits in front
# of the public name and performs upload filtering. This origin intentionally:
#   * accepts requests for online.senarathbank.com with the right Host header
#     from ANY source (V2 — reachable directly on the origin IP), and
#   * does NO upload filtering of its own (upload hardening is only at the WAF),
#     so the upload the WAF would block succeeds here (V2 + V5).
# ============================================================================

# Larger bodies so document uploads reach the origin app (V5).
client_max_body_size 12m;

# ---- Corporate site (also the default for bare-IP / unknown host) ----
server {
    listen 80 default_server;
    server_name www.senarathbank.com senarathbank.com _;

    location / {
        proxy_pass http://corporate:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ---- Online banking origin ----
server {
    listen 80;
    server_name online.senarathbank.com;

    location / {
        proxy_pass http://ebanking:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

