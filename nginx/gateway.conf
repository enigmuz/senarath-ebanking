# ============================================================================
# Senarath Bank - nginx application gateway (WEB01)
# LAB ENVIRONMENT
# ----------------------------------------------------------------------------
# Name-based routing + HTTPS for the real domain:
#   senarathbank.com, www.senarathbank.com  -> corporate container
#   ebanking.senarathbank.com               -> ebanking container
#
# Both sites share ports 80/443 (standard name-based virtual hosting). TLS uses
# a single Let's Encrypt certificate covering all three names (SNI selects the
# right vhost). Port 80 serves the ACME challenge and redirects everything to
# HTTPS. See DEPLOY_UBUNTU_PUBLIC.md for issuing the certificate.
# ============================================================================

client_max_body_size 12m;

# ---- Port 80: ACME HTTP-01 challenge + redirect to HTTPS (all names) ----
server {
    listen 80 default_server;
    server_name senarathbank.com www.senarathbank.com ebanking.senarathbank.com www.ebanking.senarathbank.com _;

    # Let's Encrypt webroot challenge (used for renewals while the gateway is up)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Corporate site (root + www) over HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name senarathbank.com www.senarathbank.com;

    ssl_certificate     /etc/letsencrypt/live/senarathbank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senarathbank.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://corporate:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# ---- Online banking over HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name ebanking.senarathbank.com www.ebanking.senarathbank.com;

    ssl_certificate     /etc/letsencrypt/live/senarathbank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senarathbank.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://ebanking:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
