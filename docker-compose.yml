# ============================================================================
# Senarath Bank — Online Banking + nginx gateway
# LAB ENVIRONMENT · deploy on WEB01 (Ubuntu + Docker)
# ----------------------------------------------------------------------------
# This compose brings up:
#   * ebanking : the online banking origin app (PHP/Apache -> MSSQL on SQL01)
#   * gateway  : the nginx application gateway that routes both hostnames
#
# The corporate site runs from the separate `senarath-corporate` repo and joins
# the same external network "senarath-net". Create that network once:
#     docker network create senarath-net
# ============================================================================
services:
  ebanking:
    build: .
    image: senarath/ebanking:lab
    container_name: senarath-ebanking
    restart: unless-stopped
    env_file:
      - .env                      # V6: plaintext DB creds injected into the env
    networks:
      senarath-net:
        aliases: [ebanking]
    # Uploaded files persist across restarts (V5 artifacts). Optional:
    volumes:
      - ebanking_uploads:/var/www/html/uploads
    # extra_hosts lets the container resolve SQL01 if you are not using DNS.
    # Replace with SQL01's real internal IP, or remove if DNS resolves it.
    extra_hosts:
      - "SQL01.senarath.local:10.10.20.11"

  gateway:
    image: nginx:1.27-alpine
    container_name: senarath-gateway
    restart: unless-stopped
    depends_on:
      - ebanking
    ports:
      - "80:80"
      # - "443:443"               # enable after adding certs (see gateway.conf)
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro   # mount TLS certs here for 443
    networks:
      senarath-net:
        aliases: [gateway]

volumes:
  ebanking_uploads:

networks:
  senarath-net:
    external: true
